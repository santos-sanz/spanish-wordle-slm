# Short repair-curriculum continuation.  It consumes the dynamic unavailable
# word list used by the harness so Pure can recover from repeated generations.
model: models/LFM2.5-2.6B-MLX-6bit
train: true
fine_tune_type: lora
optimizer: adamw
data: data/pure-refinement
seed: 20260814
num_layers: 16
batch_size: 1
iters: 100
val_batches: 20
learning_rate: 1.0e-5
steps_per_report: 5
steps_per_eval: 50
grad_accumulation_steps: 8
adapter_path: adapters/pure-repair-refinement
resume_adapter_file: adapters/pure-refinement/adapters.safetensors
save_every: 50
max_seq_length: 512
mask_prompt: true
grad_checkpoint: true
lora_parameters:
  rank: 16
  scale: 32.0
  dropout: 0.05
